<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人投资工作站</title>
<!-- 内联图标：避免浏览器向宿主站点根请求 /favicon.ico（该路径不属于本插件的 /plug-funds/ 前缀路由）。 -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2016%2016'%3E%3Cpath%20d='M13.5%208A5.5%205.5%200%201%201%208%202.5'%20fill='none'%20stroke='%234c6ef5'%20stroke-width='1.4'/%3E%3Cpath%20d='M8%202.5A5.5%205.5%200%200%201%2013.5%208H8z'%20fill='%234c6ef5'%20fill-opacity='.35'/%3E%3C/svg%3E">
<script>
  /* 主题：URL 参数只覆盖本次渲染（不写回，PRD/ADR-0048 主题模式）；缺省跟随系统。 */
  (function () {
    try {
      var p = new URLSearchParams(location.search).get('theme');
      var t = p === 'dark' || p === 'light'
        ? p
        : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = t;
    } catch (e) {
      document.documentElement.dataset.theme = 'light';
    }
  })();
</script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="root"></div>
<script src="app.js"></script>
</body>
</html>
